server_tokens off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. nginx does not inherit add_header into a location that sets its own,
    # so the same snippet is included in every location below.
    include /etc/nginx/conf.d/security-headers.inc;

    # API calls go to the backend container
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
