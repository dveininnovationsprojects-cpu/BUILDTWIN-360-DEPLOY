# BuildTwin 360 - production stack for a Linux VM (Docker Compose v2).
# Only Caddy publishes ports (80 and 443, automatic TLS). PostgreSQL and the backend are not reachable
# from outside the VM. Values come from prod/.env.prod (see .env.prod.example); nothing secret is in git.

name: buildtwin-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildtwin}
      POSTGRES_USER: ${POSTGRES_USER:-buildtwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildtwin} -d ${POSTGRES_DB:-buildtwin}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build: ../backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-buildtwin}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-buildtwin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:?Set APP_SEED_ADMIN_PASSWORD}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      SPRING_JPA_SHOW_SQL: "false"
    logging: *default-logging

  frontend:
    build: ../frontend
    restart: always
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
